<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post-Quantum Notepad</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #c9d1d9; font-family: system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, Menlo, Monaco, Consolas, monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 md:p-6">

  <!-- AUTH CARD -->
  <div id="authContainer" class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
    <div class="text-center mb-6">
      <h1 class="text-xl font-bold text-cyan-400">Quantum Vault Notepad</h1>
      <p class="text-xs text-gray-400 mt-1">NIST ML-KEM-768 Encrypted Storage</p>
    </div>

    <!-- TABS -->
    <div class="flex border-b border-gray-800 mb-6" id="tabContainer">
      <button id="tabLogin" onclick="setMode('login')" class="flex-1 pb-2.5 font-bold text-sm text-cyan-400 border-b-2 border-cyan-400 transition">
        User
      </button>
      <button id="tabRegister" onclick="setMode('register')" class="flex-1 pb-2.5 font-bold text-sm text-gray-400 hover:text-gray-200 transition">
        + New User
      </button>
    </div>

    <!-- MAIN FORM -->
    <div id="formSection" class="space-y-4">
      <div>
        <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Username</label>
        <input id="userInput" type="text" oninput="checkDeviceState()" class="w-full bg-black/50 border border-gray-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-cyan-500" placeholder="Enter username" />
      </div>

      <div>
        <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Password</label>
        <input id="passInput" type="password" class="w-full bg-black/50 border border-gray-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-cyan-500" placeholder="Enter password" />
      </div>

      <!-- MASTER KEY INPUT (Always visible/editable on User tab unless key is already saved) -->
      <div id="masterKeyContainer">
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs uppercase tracking-wider text-amber-400">Master Key</label>
          <span id="keyStatusNote" class="text-[11px] text-gray-500">Required on new devices</span>
        </div>
        <textarea id="masterKeyInput" rows="3" class="w-full bg-black/60 border border-gray-800 focus:border-cyan-500 rounded-lg p-2.5 text-xs mono text-cyan-200 focus:outline-none" placeholder="Paste your master key here (unwanted text will be auto-cleaned)..."></textarea>
      </div>

      <button id="actionBtn" onclick="handleSubmit()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-3 rounded-lg text-sm transition shadow-lg">
        Open Notepad
      </button>
    </div>

    <!-- NEW USER REGISTRATION MODAL -->
    <div id="keyModal" class="hidden mt-6 bg-black/80 border border-emerald-800 rounded-xl p-4 space-y-3">
      <div class="text-xs font-semibold text-emerald-400">ACCOUNT CREATED SUCCESSFULLY</div>
      <p class="text-xs text-gray-300">Here is your <b>Master Key</b>. Copy and save it safely.</p>
      <textarea id="createdKeyBox" rows="4" readonly class="w-full bg-black border border-gray-800 rounded p-2 text-xs mono text-cyan-300"></textarea>
      <button onclick="copyAndProceed()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-2.5 rounded font-medium transition">
        Copy Key & Open Notepad
      </button>
    </div>
  </div>

  <!-- NOTEPAD WORKSPACE -->
  <div id="notepadScreen" class="hidden w-full max-w-5xl h-[85vh] bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
    
    <div class="flex items-center justify-between px-6 py-3.5 border-b border-gray-800 bg-gray-950/60">
      <div class="flex items-center space-x-3">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-xs text-gray-400">Vault User:</span>
        <span id="activeUser" class="text-sm font-semibold text-cyan-400"></span>
      </div>
      <button onclick="logout()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3.5 py-1.5 rounded-lg border border-gray-700 transition">
        Logout
      </button>
    </div>

    <div class="flex flex-1 overflow-hidden">
      <!-- SIDEBAR -->
      <div class="w-1/3 md:w-1/4 border-r border-gray-800 flex flex-col bg-gray-950/40">
        <div class="p-3 border-b border-gray-800">
          <button onclick="createNewNote()" class="w-full bg-cyan-600/20 hover:bg-cyan-600/30 text-cyan-300 border border-cyan-500/40 font-medium py-2 rounded-lg text-xs transition flex items-center justify-center space-x-1.5">
            <span>+</span><span>New Note</span>
          </button>
        </div>
        <div id="notesList" class="flex-1 overflow-y-auto p-2 space-y-1.5"></div>
      </div>

      <!-- EDITOR -->
      <div class="flex-1 flex flex-col bg-gray-900 p-4 md:p-6 overflow-hidden">
        <div class="flex items-center justify-between mb-3 gap-2">
          <input id="noteTitle" type="text" class="flex-1 bg-black/40 border border-gray-800 rounded-lg px-3 py-2 text-base font-semibold text-white focus:outline-none focus:border-cyan-500" placeholder="Note Title..." />
          <button onclick="saveCurrentNote()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-5 py-2 rounded-lg text-xs font-medium transition shadow-md">
            Save Note
          </button>
          <button onclick="deleteCurrentNote()" class="bg-rose-950/50 hover:bg-rose-900/60 text-rose-300 border border-rose-800/60 px-3 py-2 rounded-lg text-xs transition">
            Delete
          </button>
        </div>

        <textarea id="noteText" oninput="updateStats()" class="flex-1 w-full bg-black/50 border border-gray-800 rounded-xl p-4 text-sm text-gray-100 focus:outline-none focus:border-cyan-500 resize-none font-mono leading-relaxed" placeholder="Type your secure notes here..."></textarea>

        <div class="flex items-center justify-between pt-3 text-[11px] text-gray-500">
          <span id="saveStatus">Encrypted with NIST ML-KEM-768</span>
          <span id="wordStats">0 words | 0 characters</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = "";
    let currentMode = "login";
    let sessionUser = "";
    let sessionPass = "";
    let sessionKey = "";
    
    let notes = [];
    let currentNoteId = null;

    function setMode(mode) {
      currentMode = mode;
      const tabLogin = document.getElementById("tabLogin");
      const tabRegister = document.getElementById("tabRegister");
      const btn = document.getElementById("actionBtn");
      const masterKeyBox = document.getElementById("masterKeyContainer");

      if (mode === "register") {
        tabRegister.className = "flex-1 pb-2.5 font-bold text-sm text-cyan-400 border-b-2 border-cyan-400 transition";
        tabLogin.className = "flex-1 pb-2.5 font-bold text-sm text-gray-400 hover:text-gray-200 transition";
        btn.innerText = "Register New Account";
        btn.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-lg text-sm transition shadow-lg";
        masterKeyBox.classList.add("hidden");
      } else {
        tabLogin.className = "flex-1 pb-2.5 font-bold text-sm text-cyan-400 border-b-2 border-cyan-400 transition";
        tabRegister.className = "flex-1 pb-2.5 font-bold text-sm text-gray-400 hover:text-gray-200 transition";
        btn.innerText = "Open Notepad";
        btn.className = "w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-3 rounded-lg text-sm transition shadow-lg";
        masterKeyBox.classList.remove("hidden");
        checkDeviceState();
      }
    }

    function checkDeviceState() {
      if (currentMode === "register") return;
      const username = document.getElementById("userInput").value.trim();
      const noteLabel = document.getElementById("keyStatusNote");
      const keyInput = document.getElementById("masterKeyInput");

      if (!username) {
        noteLabel.innerText = "Required on new devices";
        return;
      }

      const savedKey = localStorage.getItem(`vault_master_key_${username}`);
      if (savedKey) {
        noteLabel.innerText = "Auto-saved on this device (paste only to override)";
        keyInput.placeholder = "Key saved in browser memory. Leave blank or paste to replace.";
      } else {
        noteLabel.innerText = "New device: paste master key";
        keyInput.placeholder = "Paste your master key here (unwanted text will be auto-cleaned)...";
      }
    }

    // Auto-cleans any unwanted text, sentences, or labels from the pasted string
    function cleanMasterKey(raw) {
      if (!raw) return "";
      const match = raw.match(/\{[\s\S]*\}/);
      return match ? match[0].trim() : raw.trim();
    }

    async function handleSubmit() {
      const username = document.getElementById("userInput").value.trim();
      const password = document.getElementById("passInput").value.trim();
      if (!username || !password) return alert("Please enter both username and password.");

      if (currentMode === "register") {
        const regRes = await fetch(`${API}/api/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const regData = await regRes.json();

        if (!regRes.ok) return alert(regData.detail || "Registration failed");

        localStorage.setItem(`vault_master_key_${username}`, regData.master_key);
        sessionUser = username;
        sessionPass = password;
        sessionKey = regData.master_key;

        document.getElementById("formSection").classList.add("hidden");
        document.getElementById("tabContainer").classList.add("hidden");
        document.getElementById("createdKeyBox").value = regData.master_key;
        document.getElementById("keyModal").classList.remove("hidden");
      } else {
        let masterKey = cleanMasterKey(document.getElementById("masterKeyInput").value);
        
        // If not typed in, check local storage
        if (!masterKey) {
          masterKey = localStorage.getItem(`vault_master_key_${username}`);
        }

        if (!masterKey) {
          return alert("Please paste your Master Key into the box to open your vault on this device.");
        }

        const loginRes = await fetch(`${API}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, master_key: masterKey })
        });
        const loginData = await loginRes.json();

        if (loginRes.ok) {
          // Permanently remember key on this device
          localStorage.setItem(`vault_master_key_${username}`, masterKey);
          sessionUser = username;
          sessionPass = password;
          sessionKey = masterKey;
          notes = loginData.notes || [];
          openNotepad(username);
        } else {
          alert(loginData.detail || "Authentication Failed. Check password or master key.");
        }
      }
    }

    function copyAndProceed() {
      const pureKey = document.getElementById("createdKeyBox").value.trim();
      navigator.clipboard.writeText(pureKey);
      alert("Master Key copied to clipboard!");
      notes = [];
      openNotepad(sessionUser);
    }

    function openNotepad(username) {
      document.getElementById("authContainer").classList.add("hidden");
      document.getElementById("notepadScreen").classList.remove("hidden");
      document.getElementById("notepadScreen").classList.add("flex");
      document.getElementById("activeUser").innerText = username;

      if (notes.length === 0) {
        createNewNote();
      } else {
        selectNote(notes[0].id);
      }
      renderNotesList();
    }

    function renderNotesList() {
      const container = document.getElementById("notesList");
      container.innerHTML = "";

      notes.forEach(note => {
        const item = document.createElement("div");
        const isActive = note.id === currentNoteId;
        item.className = `p-2.5 rounded-lg cursor-pointer transition text-xs flex flex-col ${
          isActive ? "bg-cyan-950/60 border border-cyan-800 text-cyan-300" : "bg-black/30 hover:bg-gray-800 text-gray-400 border border-transparent"
        }`;
        item.onclick = () => selectNote(note.id);

        const titleText = note.title || "Untitled Note";
        const previewText = note.content ? note.content.substring(0, 30) + "..." : "Empty note...";

        item.innerHTML = `
          <span class="font-semibold text-white truncate">${titleText}</span>
          <span class="text-[11px] text-gray-500 truncate mt-0.5">${previewText}</span>
        `;
        container.appendChild(item);
      });
    }

    function createNewNote() {
      const newId = "note_" + Date.now();
      const newNote = { id: newId, title: "Untitled Note", content: "", updated_at: Date.now() };
      notes.unshift(newNote);
      selectNote(newId);
    }

    function selectNote(id) {
      currentNoteId = id;
      const note = notes.find(n => n.id === id);
      if (note) {
        document.getElementById("noteTitle").value = note.title || "";
        document.getElementById("noteText").value = note.content || "";
        updateStats();
        document.getElementById("saveStatus").innerText = "Loaded from vault.";
        document.getElementById("saveStatus").className = "text-gray-400";
      }
      renderNotesList();
    }

    function updateStats() {
      const text = document.getElementById("noteText").value;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const chars = text.length;
      document.getElementById("wordStats").innerText = `${words} words | ${chars} characters`;
    }

    async function saveCurrentNote() {
      if (!currentNoteId) return;
      const title = document.getElementById("noteTitle").value.trim() || "Untitled Note";
      const content = document.getElementById("noteText").value;
      const status = document.getElementById("saveStatus");

      status.innerText = "Encrypting with Lattice Cryptography...";
      status.className = "text-cyan-400";

      try {
        const res = await fetch(`${API}/api/save-note`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: sessionUser,
            password: sessionPass,
            master_key: sessionKey,
            note_id: currentNoteId,
            title: title,
            content: content
          })
        });

        if (res.ok) {
          status.innerText = "Saved & Quantum-Locked across all devices!";
          status.className = "text-emerald-400";

          const current = notes.find(n => n.id === currentNoteId);
          if (current) {
            current.title = title;
            current.content = content;
          }
          renderNotesList();
        } else {
          status.innerText = "Failed to save.";
          status.className = "text-rose-400";
        }
      } catch (e) {
        status.innerText = "Connection error.";
        status.className = "text-rose-400";
      }
    }

    async function deleteCurrentNote() {
      if (!currentNoteId) return;
      if (!confirm("Are you sure you want to delete this encrypted note?")) return;

      try {
        await fetch(`${API}/api/delete-note`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: sessionUser,
            password: sessionPass,
            master_key: sessionKey,
            note_id: currentNoteId
          })
        });

        notes = notes.filter(n => n.id !== currentNoteId);
        if (notes.length === 0) {
          createNewNote();
        } else {
          selectNote(notes[0].id);
        }
      } catch (e) {
        alert("Failed to delete note.");
      }
    }

    function logout() {
      sessionUser = "";
      sessionPass = "";
      sessionKey = "";
      currentNoteId = null;
      notes = [];
      document.getElementById("notepadScreen").classList.add("hidden");
      document.getElementById("notepadScreen").classList.remove("flex");
      document.getElementById("authContainer").classList.remove("hidden");
      document.getElementById("formSection").classList.remove("hidden");
      document.getElementById("tabContainer").classList.remove("hidden");
      document.getElementById("keyModal").classList.add("hidden");
      document.getElementById("passInput").value = "";
      document.getElementById("masterKeyInput").value = "";
      setMode("login");
    }
  </script>
</body>
</html>
