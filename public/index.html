<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantum Vault Notepad</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
    }
    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 4px;
      color: #58a6ff;
    }
    .subtitle {
      font-size: 0.8rem;
      text-align: center;
      color: #8b949e;
      margin-bottom: 24px;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid #30363d;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: #8b949e;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
      color: #58a6ff;
      border-bottom-color: #58a6ff;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      color: #8b949e;
      text-transform: uppercase;
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #58a6ff;
    }
    textarea {
      resize: vertical;
      min-height: 120px;
    }
    button.primary-btn {
      width: 100%;
      padding: 12px;
      background-color: #238636;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button.primary-btn:hover {
      background-color: #2ea043;
    }
    .hidden {
      display: none !important;
    }
    #keyModal {
      background-color: #0d1117;
      border: 1px solid #da3633;
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    #keyModal p {
      font-size: 0.8rem;
      color: #f85149;
      margin-bottom: 8px;
    }
    #keyDisplay {
      width: 100%;
      height: 80px;
      background: #161b22;
      color: #79c0ff;
      font-family: monospace;
      font-size: 0.75rem;
      margin-bottom: 10px;
    }
    .notes-list {
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid #30363d;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    .note-item {
      padding: 10px;
      border-bottom: 1px solid #30363d;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .note-item:hover {
      background: #21262d;
    }
    .danger-btn {
      background-color: #da3633;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    .danger-btn:hover {
      background-color: #b62324;
    }
    .lock-btn {
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    .lock-btn:hover {
      background-color: #30363d;
      color: #58a6ff;
    }
  </style>
</head>
<body>

  <!-- Authentication Card -->
  <div class="card" id="authSection">
    <h1>Quantum Vault Notepad</h1>
    <div class="subtitle">NIST ML-KEM-768 Encrypted Storage</div>

    <div class="tabs">
      <button class="tab-btn active" id="tabLoginBtn" onclick="switchAuthTab('login')">User</button>
      <button class="tab-btn" id="tabRegBtn" onclick="switchAuthTab('register')">+ New User</button>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
      <label>Username</label>
      <input type="text" id="loginUser" placeholder="username" />

      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••" />

      <label>Master Key (JSON)</label>
      <textarea id="loginKey" placeholder='{"x25519_priv": "...", "ml_kem_priv": "..."}'></textarea>

      <button class="primary-btn" onclick="handleLogin()">Login / Unlock</button>
    </div>

    <!-- Registration Form -->
    <div id="regForm" class="hidden">
      <label>Username</label>
      <input type="text" id="regUser" placeholder="username" />

      <label>Password</label>
      <input type="password" id="regPass" placeholder="••••" />

      <button class="primary-btn" onclick="handleRegister()">Register New Account</button>
    </div>
  </div>

  <!-- Master Key Backup Screen -->
  <div class="card hidden" id="backupSection">
    <h1>Account Created</h1>
    <div class="subtitle">Save Your Post-Quantum Private Key</div>
    <div id="keyModal">
      <p>WARNING: If you lose this key, your encrypted notes cannot be recovered!</p>
      <textarea id="keyDisplay" readonly></textarea>
      <button class="primary-btn" style="background-color: #1f6feb;" onclick="proceedToVault()">I Saved It &rarr; Continue to Vault</button>
    </div>
  </div>

  <!-- Notepad App View -->
  <div class="card hidden" id="vaultSection" style="max-width: 650px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h1 style="text-align: left; margin-bottom: 0;" id="vaultUserTitle">Vault</h1>
      <div style="display: flex; gap: 8px;">
        <button class="lock-btn" onclick="handleLock()">🔒 Lock</button>
        <button class="danger-btn" onclick="handleLogout()">Logout</button>
      </div>
    </div>

    <div class="notes-list" id="notesContainer"></div>

    <label>Note Title</label>
    <input type="text" id="noteTitle" placeholder="Title" />

    <label>Note Content</label>
    <textarea id="noteContent" style="min-height: 180px;" placeholder="Write your private note..."></textarea>

    <div style="display: flex; gap: 10px;">
      <button class="primary-btn" onclick="handleSaveNote()">Save Note</button>
      <button class="tab-btn" style="border: 1px solid #30363d;" onclick="resetNoteEditor()">+ New</button>
    </div>
  </div>

  <script>
    let activeUser = "";
    let activePass = "";
    let activeKey = "";
    let activeNoteId = null;
    let loadedNotes = [];

    // Pre-fill login inputs on startup if previously saved on this device
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('pqc_user');
      const savedKey = localStorage.getItem('pqc_master_key');
      if (savedUser) document.getElementById('loginUser').value = savedUser;
      if (savedKey) document.getElementById('loginKey').value = savedKey;
    });

    function switchAuthTab(tab) {
      document.getElementById('tabLoginBtn').classList.toggle('active', tab === 'login');
      document.getElementById('tabRegBtn').classList.toggle('active', tab === 'register');
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('regForm').classList.toggle('hidden', tab !== 'register');
    }

    async function handleRegister() {
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value;

      if (!username || !password) {
        alert("Please provide both username and password.");
        return;
      }

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          alert(data.detail || "Registration failed");
          return;
        }

        // Retain credentials in memory
        activeUser = username;
        activePass = password;
        activeKey = data.master_key;

        // Permanently persist credentials on this device
        localStorage.setItem('pqc_user', username);
        localStorage.setItem('pqc_master_key', data.master_key);

        // Show backup screen
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('backupSection').classList.remove('hidden');
        document.getElementById('keyDisplay').value = data.master_key;
      } catch (err) {
        alert("Error connecting to server: " + err.message);
      }
    }

    function proceedToVault() {
      document.getElementById('backupSection').classList.add('hidden');
      document.getElementById('vaultSection').classList.remove('hidden');
      document.getElementById('vaultUserTitle').innerText = activeUser + "'s Vault";
      loadNotes([]);
    }

    async function handleLogin() {
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      const master_key = document.getElementById('loginKey').value.trim();

      if (!username || !password || !master_key) {
        alert("Please enter username, password, and master key.");
        return;
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, master_key })
        });
        const data = await res.json();

        if (!res.ok) {
          alert(data.detail || "Login failed");
          return;
        }

        activeUser = username;
        activePass = password;
        activeKey = master_key;

        // Permanently persist credentials on this device
        localStorage.setItem('pqc_user', username);
        localStorage.setItem('pqc_master_key', master_key);

        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('vaultSection').classList.remove('hidden');
        document.getElementById('vaultUserTitle').innerText = activeUser + "'s Vault";
        loadNotes(data.notes || []);
      } catch (err) {
        alert("Connection error: " + err.message);
      }
    }

    function loadNotes(notes) {
      loadedNotes = notes;
      const container = document.getElementById('notesContainer');
      container.innerHTML = "";
      if (notes.length === 0) {
        container.innerHTML = '<div style="padding: 10px; color: #8b949e; text-align: center;">No notes saved yet</div>';
        return;
      }
      notes.forEach((note) => {
        const div = document.createElement('div');
        div.className = 'note-item';
        div.innerHTML = `<span><strong>${note.title}</strong></span> <button class="danger-btn" onclick="handleDeleteNote('${note.id}', event)">Delete</button>`;
        div.onclick = () => {
          activeNoteId = note.id;
          document.getElementById('noteTitle').value = note.title;
          document.getElementById('noteContent').value = note.content;
        };
        container.appendChild(div);
      });
    }

    function resetNoteEditor() {
      activeNoteId = null;
      document.getElementById('noteTitle').value = "";
      document.getElementById('noteContent').value = "";
    }

    async function handleSaveNote() {
      const title = document.getElementById('noteTitle').value.trim() || "Untitled Note";
      const content = document.getElementById('noteContent').value;
      const note_id = activeNoteId || ("note_" + Date.now());

      if (!activeUser || !activePass || !activeKey) {
        alert("Session lost. Please unlock again.");
        return;
      }

      try {
        const res = await fetch('/api/save-note', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: activeUser,
            password: activePass,
            master_key: activeKey,
            note_id: note_id,
            title: title,
            content: content
          })
        });
        const data = await res.json();

        if (!res.ok) {
          alert("Failed to save: " + (data.detail || "Server error"));
          return;
        }

        alert("Note saved securely!");
        activeNoteId = note_id;

        const existing = loadedNotes.find(n => n.id === note_id);
        if (existing) {
          existing.title = title;
          existing.content = content;
        } else {
          loadedNotes.push({ id: note_id, title, content });
        }
        loadNotes(loadedNotes);
      } catch (err) {
        alert("Error saving: " + err.message);
      }
    }

    async function handleDeleteNote(noteId, event) {
      event.stopPropagation();
      if (!confirm("Are you sure you want to delete this note?")) return;

      try {
        const res = await fetch('/api/delete-note', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: activeUser,
            password: activePass,
            master_key: activeKey,
            note_id: noteId
          })
        });

        if (res.ok) {
          loadedNotes = loadedNotes.filter(n => n.id !== noteId);
          loadNotes(loadedNotes);
          if (activeNoteId === noteId) resetNoteEditor();
        } else {
          alert("Failed to delete note.");
        }
      } catch (err) {
        alert("Error deleting note: " + err.message);
      }
    }

    // 🔒 Lock: Retains saved keys on this device, requires only password to unlock
    function handleLock() {
      activePass = "";
      activeNoteId = null;
      resetNoteEditor();

      document.getElementById('vaultSection').classList.add('hidden');
      document.getElementById('authSection').classList.remove('hidden');
      switchAuthTab('login');

      // Autofill username & master key from persistent storage
      const savedUser = localStorage.getItem('pqc_user');
      const savedKey = localStorage.getItem('pqc_master_key');
      if (savedUser) document.getElementById('loginUser').value = savedUser;
      if (savedKey) document.getElementById('loginKey').value = savedKey;

      const passField = document.getElementById('loginPass');
      passField.value = "";
      passField.focus();
    }

    // Full Logout: Wipes all keys and saved data from this device
    function handleLogout() {
      activeUser = "";
      activePass = "";
      activeKey = "";
      activeNoteId = null;

      localStorage.removeItem('pqc_user');
      localStorage.removeItem('pqc_master_key');

      document.getElementById('vaultSection').classList.add('hidden');
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('loginUser').value = "";
      document.getElementById('loginPass').value = "";
      document.getElementById('loginKey').value = "";
      resetNoteEditor();
      switchAuthTab('login');
    }
  </script>
</body>
</html>
